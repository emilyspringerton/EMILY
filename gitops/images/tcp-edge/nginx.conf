# tcp-edge: the ONE TCP load balancer rule on the shared game IP. Port-routes raw TCP to in-cluster ClusterIP services.
# Add a port: a `server` block here + the port in specs/tcp-edge.pod, rebuild images/tcp-edge, render, apply.
worker_processes 2;
pid /tmp/nginx.pid;
events { worker_connections 4096; }
stream {
    proxy_timeout 24h;
    proxy_connect_timeout 5s;
    server { listen 2323; proxy_pass gfd-core:2323; }   # GFD MUD telnet
    server { listen 2222; proxy_pass gfd-core:2222; }   # GFD ssh
    server { listen 7171; proxy_pass gfd-core:7171; }   # GFD events API
    server { listen 7070; proxy_pass gfd-core:7070; }   # GFD worldapi
    server { listen 8443; proxy_pass iduna:8443; }      # IDUNA sc_tunnel (box localhost:8080 client)
    server { listen 7180; proxy_pass deadweight:7180; } # DEADWEIGHT dw_server
    server { listen 7800; proxy_pass deadweight2:7800; } # DEADWEIGHT_2 dw2_server
    server { listen 25565; proxy_pass einhorn-survival:25565; } # EINHORN_SURVIVAL Minecraft Java
}
