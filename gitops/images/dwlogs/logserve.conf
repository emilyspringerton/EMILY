# Read-only, cluster-internal (ClusterIP only) server for DEADWEIGHT's two append-only match logs.
server {
    listen 8081;
    location = /matches.ndjson { alias /app/var/matches/matches.ndjson; }
    location = /decks.ndjson   { alias /app/var/matches/decks.ndjson; }
    location / { return 404; }
}
