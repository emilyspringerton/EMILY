# okemily.com static site, served from IDUNA's PVC (/app/var/www) -- IDUNA writes blog/tyler/prompt-o-verse there.
server {
    listen 80;
    root /app/var/www;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /prompt-o-verse/ { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
