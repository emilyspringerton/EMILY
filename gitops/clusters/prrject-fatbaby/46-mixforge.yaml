apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixforge
  namespace: emily
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mixforge
  template:
    metadata:
      labels:
        app: mixforge
    spec:
      securityContext:
        fsGroup: 65532
      initContainers:
        # yt-dlp rewrites its cookie jar on exit, so the Secret (read-only) is copied to the writable var volume.
        # Refresh: kubectl create secret generic mixforge-cookies -n emily --from-file=ytdlp-cookies.txt=<file> --dry-run=client -o yaml | kubectl apply -f - ; kubectl rollout restart deploy/mixforge -n emily
        - name: cookies
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/mixforge-room:v3
          command: ["/bin/sh", "-c", "if [ -f /cookies-src/ytdlp-cookies.txt ]; then cp /cookies-src/ytdlp-cookies.txt /app/var/ytdlp-cookies.txt && chmod 0600 /app/var/ytdlp-cookies.txt; fi"]
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: cookies-src
              mountPath: /cookies-src
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 16Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 50m, memory: 32Mi, ephemeral-storage: 64Mi}
      containers:
        - name: room
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/mixforge-room:v3
          command:
            - /run-room.sh
          ports:
            - containerPort: 8973
          readinessProbe:
            tcpSocket:
              port: 8973
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/mixforge/notify
            # Re-add MIXFORGE_YTDLP_COOKIES=/app/var/ytdlp-cookies.txt to use the cookies. Left off: cookies exported from
            # a home IP are rejected by YouTube from GKE ("page needs to be reloaded") and break downloads that work without.
          envFrom:
            - secretRef:
                optional: true
                name: mixforge-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/mixforge
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
        - name: web
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/mixforge-web:v3
          command:
            - /run-nginx.sh
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/mixforge/notify
          envFrom:
            - secretRef:
                optional: true
                name: mixforge-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/mixforge
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: var
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: cookies-src
          secret:
            secretName: mixforge-cookies
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mixforge
  namespace: emily
spec:
  selector:
    app: mixforge
  ports:
    - name: p80
      port: 80
      targetPort: 80
  type: ClusterIP
