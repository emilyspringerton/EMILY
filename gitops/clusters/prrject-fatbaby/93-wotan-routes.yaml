apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wotan
  namespace: emily
spec:
  parentRefs:
    - name: edge-gw
  hostnames:
    - wotan.okemily.com
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/}
      backendRefs:
        - name: iduna
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /DEADWEIGHT/ws}
      backendRefs:
        - name: deadweight
          port: 8765
    - matches:
        - path: {type: PathPrefix, value: /GFD/ws}
      backendRefs:
        - name: gfd-core
          port: 8480
    - backendRefs:
        - name: wotan
          port: 80
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: deadweight
  namespace: emily
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: ""
    kind: Service
    name: deadweight
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: deadweight
  namespace: emily
spec:
  default:
    config:
      type: TCP
      tcpHealthCheck:
        port: 8765
  targetRef:
    group: ""
    kind: Service
    name: deadweight
---
# gfd-core: WebSocket sessions (the browser MUD client) outlive the LB's 30s default timeout.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: gfd-core
  namespace: emily
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: ""
    kind: Service
    name: gfd-core
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: gfd-core
  namespace: emily
spec:
  default:
    config:
      type: TCP
      tcpHealthCheck:
        port: 8480
  targetRef:
    group: ""
    kind: Service
    name: gfd-core
