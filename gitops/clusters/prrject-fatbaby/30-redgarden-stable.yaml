apiVersion: apps/v1
kind: Deployment
metadata:
  name: redgarden-stable
  namespace: emily
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redgarden-stable
  template:
    metadata:
      labels:
        app: redgarden-stable
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: matchmaker
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/redgarden-stable:3e55798
          command:
            - /app/build/red_garden_matchmaker
          args:
            - "--listen-port"
            - "8778"
            - "--lobby-size"
            - "20"
            - "--server-bin"
            - "/app/build/red_garden_arena_server"
            - "--first-game-port"
            - "8300"
            - "--game-port-range"
            - "20"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/redgarden/notify
          envFrom:
            - secretRef:
                optional: true
                name: redgarden-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/redgarden
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
        - name: bot-pool
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/redgarden-stable:3e55798
          command:
            - /app/scripts/run_bot_pool.sh
          args:
            - "19"
            - "8778"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/redgarden/notify
          envFrom:
            - secretRef:
                optional: true
                name: redgarden-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/redgarden
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: var
          emptyDir: {}
        - name: run
          emptyDir: {}
---
