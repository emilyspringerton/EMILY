---
apiVersion: v1
kind: Service
metadata:
  name: fatbaby-core
  namespace: emily
spec:
  selector:
    app: fatbaby-core
  ports:
    - name: p8082
      port: 8082
      targetPort: 8082
    - name: p9091
      port: 9091
      targetPort: 9091
  type: ClusterIP
