            - "-also-listen"
            - "unix:///run/fatbaby/newssite.sock"
            - "-signalapi-url"
            - "unix:///run/fatbaby/signalapi.sock"
          ports:
            - containerPort: 8082
          readinessProbe:
            tcpSocket:
              port: 8082
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 500m
              memory: 2048Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 2048Mi
              ephemeral-storage: 256Mi
        - name: eps-processor
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
