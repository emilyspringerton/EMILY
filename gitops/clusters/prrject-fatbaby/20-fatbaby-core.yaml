            - "/app/var/secwatch"
            - "-prwatch-store"
            - "/app/var/prwatch"
            - "-store"
            - "/app/var/pr-reaction"
            - "-poll-interval"
            - "60s"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 50m
              memory: 768Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 50m
              memory: 768Mi
              ephemeral-storage: 256Mi
        - name: form4-watcher
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/form4-watcher
          args:
