apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fatbaby-var
  namespace: emily
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fatbaby-core
  namespace: emily
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fatbaby-core
  template:
    metadata:
      labels:
        app: fatbaby-core
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: secwatch
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/secwatch
          args:
            - "-watchlist"
            - "/app/config/watchlist.json"
            - "-store"
            - "/app/var/secwatch"
            - "-poll-interval"
            - "5m"
            - "-rate-rps"
            - "2"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 100m
              memory: 1024Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 100m
              memory: 1024Mi
              ephemeral-storage: 256Mi
        - name: prwatch
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/prwatch
          args:
            - "-store"
            - "/app/var/prwatch"
            - "-poll-interval"
            - "30s"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 50m
              memory: 96Mi
              ephemeral-storage: 256Mi
        - name: prwatch-body
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/prwatch-body
          args:
            - "-discovery-store"
            - "/app/var/prwatch"
            - "-body-store"
            - "/app/var/prwatch-body"
            - "-poll-interval"
            - "15s"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 50m
              memory: 192Mi
              ephemeral-storage: 256Mi
        - name: processor
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/processor
          args:
            - "-store"
            - "/app/var/secwatch"
            - "-workers"
            - "4"
            - "-poll-interval"
            - "15s"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 256Mi
        - name: entity-graph
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/entity-graph
          args:
            - "-store"
            - "/app/var/secwatch"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 100m
              memory: 768Mi
              ephemeral-storage: 256Mi
        - name: signalapi
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/signalapi
          args:
            - "-addr"
            - ":9091"
            - "-also-listen"
            - "unix:///run/fatbaby/signalapi.sock"
            - "-store"
            - "/app/var/secwatch"
          ports:
            - containerPort: 9091
          readinessProbe:
            tcpSocket:
              port: 9091
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 100m
              memory: 1280Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 100m
              memory: 1280Mi
              ephemeral-storage: 256Mi
        - name: newssite
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
