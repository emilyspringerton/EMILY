          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 256Mi
        - name: nt-watcher
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/nt-watcher
          args:
