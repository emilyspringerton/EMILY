            - "-body-store"
            - "/app/var/prwatch-body"
            - "-out-dir"
            - "/app/var/guidance"
            - "-cursor"
            - "/app/var/guidance-watcher/.cursor"
            - "-poll-interval"
            - "30s"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 256Mi
        - name: pr-indexer
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/pr-indexer
          args:
            - "-discovery-store"
            - "/app/var/prwatch"
            - "-body-store"
            - "/app/var/prwatch-body"
            - "-out-store"
            - "/app/var/secwatch"
            - "-cursor"
            - "/app/var/pr-indexer/.cursor"
            - "-poll-interval"
            - "30s"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/fatbaby/notify
          envFrom:
            - secretRef:
                optional: true
                name: fatbaby-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/fatbaby
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 256Mi
        - name: pr-reaction-watcher
          image: us-central1-docker.pkg.dev/project-d24a71e9-2daf-4b2d-917/emily/fatbaby:0.1.0
          command:
            - /app/bin/pr-reaction-watcher
          args:
