apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gw
  namespace: emily
  annotations:
    networking.gke.io/certmap: edge-certs
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
  addresses:
    - type: NamedAddress
      value: gateway-edge
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gfd-wsrelay
  namespace: emily
spec:
  parentRefs:
    - name: edge-gw
  hostnames:
    - ws.rg.okemily.com
  rules:
    - backendRefs:
        - name: gfd-wsrelay
          port: 8081
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: gfd-wsrelay
  namespace: emily
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: ""
    kind: Service
    name: gfd-wsrelay
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: collections-server
  namespace: emily
spec:
  parentRefs:
    - name: edge-gw
  hostnames:
    - golden.okemily.com
  rules:
    - backendRefs:
        - name: collections-server
          port: 8087
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: collections-server
  namespace: emily
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: ""
    kind: Service
    name: collections-server
