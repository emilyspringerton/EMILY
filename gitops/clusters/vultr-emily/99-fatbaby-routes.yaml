apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fatbaby-news
  namespace: emily
spec:
  parentRefs:
    - name: edge-gw
  hostnames:
    - news.okemily.com
  rules:
    - backendRefs:
        - name: fatbaby-core
          port: 8082
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fatbaby-signals
  namespace: emily
spec:
  parentRefs:
    - name: edge-gw
  hostnames:
    - signals.okemily.com
  rules:
    - backendRefs:
        - name: fatbaby-signals
          port: 9091
---
# Own Service so its HealthCheckPolicy (signalapi 404s on "/") doesn't change newssite's probe on fatbaby-core.
apiVersion: v1
kind: Service
metadata:
  name: fatbaby-signals
  namespace: emily
spec:
  selector:
    app: fatbaby-core
  ports:
    - {name: http, port: 9091, targetPort: 9091}
