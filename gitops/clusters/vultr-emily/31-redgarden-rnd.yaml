apiVersion: apps/v1
kind: Deployment
metadata:
  name: redgarden-rnd
  namespace: emily
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redgarden-rnd
  template:
    metadata:
      labels:
        app: redgarden-rnd
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: mm-bots
          image: ewr.vultrcr.com/emily/redgarden-rnd:3e55798
          command:
            - /app/build/red_garden_matchmaker
          args:
            - "--listen-port"
            - "7778"
            - "--lobby-size"
            - "20"
            - "--server-bin"
            - "/app/build/red_garden_arena_server"
            - "--first-game-port"
            - "7300"
            - "--game-port-range"
            - "20"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/redgarden/notify
          envFrom:
            - secretRef:
                optional: true
                name: redgarden-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/redgarden
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
        - name: mm-players
          image: ewr.vultrcr.com/emily/redgarden-rnd:3e55798
          command:
            - /app/build/red_garden_matchmaker
          args:
            - "--listen-port"
            - "7779"
            - "--lobby-size"
            - "2"
            - "--server-bin"
            - "/app/build/red_garden_arena_server"
            - "--first-game-port"
            - "7600"
            - "--game-port-range"
            - "10"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/redgarden/notify
          envFrom:
            - secretRef:
                optional: true
                name: redgarden-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/redgarden
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
        - name: mm-3v3
          image: ewr.vultrcr.com/emily/redgarden-rnd:3e55798
          command:
            - /app/build/red_garden_matchmaker
          args:
            - "--listen-port"
            - "7780"
            - "--lobby-size"
            - "6"
            - "--server-bin"
            - "/app/build/red_garden_arena_server"
            - "--first-game-port"
            - "7400"
            - "--game-port-range"
            - "10"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/redgarden/notify
          envFrom:
            - secretRef:
                optional: true
                name: redgarden-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/redgarden
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
        - name: pool-bots
          image: ewr.vultrcr.com/emily/redgarden-rnd:3e55798
          command:
            - /app/scripts/run_bot_pool.sh
          args:
            - "19"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/redgarden/notify
          envFrom:
            - secretRef:
                optional: true
                name: redgarden-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/redgarden
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
        - name: pool-3v3
          image: ewr.vultrcr.com/emily/redgarden-rnd:3e55798
          command:
            - /app/scripts/run_bot_pool.sh
          args:
            - "5"
            - "7780"
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/redgarden/notify
          envFrom:
            - secretRef:
                optional: true
                name: redgarden-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/redgarden
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
