apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gfd-var
  namespace: emily
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gfd-core
  namespace: emily
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gfd-core
  template:
    metadata:
      labels:
        app: gfd-core
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: mud
          image: ewr.vultrcr.com/emily/gfd:5dcfe7d
          command:
            - /app/mud
          args:
            - "-port"
            - "2323"
            - "-api-port"
            - "7171"
            - "-ssh-port"
            - "2222"
            - "-web-port"
            - "8480"
            - "-web-trust-xff"
          ports:
            - containerPort: 2323
          readinessProbe:
            tcpSocket:
              port: 2323
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/gfd/notify
          envFrom:
            - secretRef:
                optional: true
                name: gfd-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/gfd
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
        - name: server-go
          image: ewr.vultrcr.com/emily/gfd:5dcfe7d
          command:
            - /app/server-go
          args:
            - "-udp-port"
            - "6970"
            - "-worldapi-port"
            - "7070"
            - "-trapx-port"
            - "7071"
          ports:
            - containerPort: 7070
          readinessProbe:
            tcpSocket:
              port: 7070
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/gfd/notify
          envFrom:
            - secretRef:
                optional: true
                name: gfd-env
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: run
              mountPath: /run/gfd
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
        - name: hostports
          image: registry.k8s.io/pause:3.10
          ports:
            - containerPort: 6970
              hostPort: 6970
              protocol: UDP
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 16Mi
      volumes:
        - name: var
          persistentVolumeClaim:
            claimName: gfd-var
        - name: run
          emptyDir: {}
      nodeSelector:
        emily/pool: game
---
apiVersion: v1
kind: Service
metadata:
  name: gfd-core
  namespace: emily
spec:
  selector:
    app: gfd-core
  ports:
    - name: p2323
      port: 2323
      targetPort: 2323
    - name: p2222
      port: 2222
      targetPort: 2222
    - name: p7171
      port: 7171
      targetPort: 7171
    - name: p7070
      port: 7070
      targetPort: 7070
    - name: p7071
      port: 7071
      targetPort: 7071
    - name: p8480
      port: 8480
      targetPort: 8480
  type: ClusterIP
