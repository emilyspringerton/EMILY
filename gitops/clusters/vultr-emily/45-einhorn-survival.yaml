apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: einhorn-var
  namespace: emily
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: einhorn-survival
  namespace: emily
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: einhorn-survival
  template:
    metadata:
      labels:
        app: einhorn-survival
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: paper
          image: ewr.vultrcr.com/emily/einhorn-survival:v1
          command:
            - /run-paper.sh
          ports:
            - containerPort: 25565
          readinessProbe:
            tcpSocket:
              port: 25565
          env:
            - name: FATBABY_NOTIFY_DIR
              value: /run/einhorn/notify
          envFrom:
            - secretRef:
                optional: true
                name: einhorn-env
          volumeMounts:
            - name: var
              mountPath: /data
            - name: run
              mountPath: /run/einhorn
          resources:
            requests:
              cpu: 1000m
              memory: 4096Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 4096Mi
              ephemeral-storage: 256Mi
        - name: hostports
          image: registry.k8s.io/pause:3.10
          ports:
            - containerPort: 19133
              hostPort: 19133
              protocol: UDP
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 16Mi
      volumes:
        - name: var
          persistentVolumeClaim:
            claimName: einhorn-var
        - name: run
          emptyDir: {}
      nodeSelector:
        emily/pool: game
---
apiVersion: v1
kind: Service
metadata:
  name: einhorn-survival
  namespace: emily
spec:
  selector:
    app: einhorn-survival
  ports:
    - name: p25565
      port: 25565
      targetPort: 25565
  type: ClusterIP
