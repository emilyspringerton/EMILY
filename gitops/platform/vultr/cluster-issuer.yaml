# Let's Encrypt via DNS-01 on Cloudflare: the only way to issue the wildcards (*.okemily.com, *.rg.okemily.com,
# *.carepyre.org) that GCP Certificate Manager used to hold. Needs Secret cert-manager/cloudflare-api-token
# (key api-token; Zone:DNS:Edit + Zone:Zone:Read on okemily.com AND carepyre.org) -- bootstrap.sh creates it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-dns-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
