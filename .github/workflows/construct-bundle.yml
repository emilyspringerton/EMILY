name: Construct Bundle

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate construct bundle
        shell: bash
        run: |
          set -euo pipefail

          out_file="EMILY_CONSTRUCT.txt"
          run_number="${GITHUB_RUN_NUMBER:-local}"
          {
            echo "Repository: EMILY | Run: ${run_number}"
            echo
          } > "${out_file}"

          while IFS= read -r relpath; do
            {
              echo "--- FILE START: ${relpath} ---"
              cat "${relpath}"
              echo
              echo "--- FILE END: ${relpath} ---"
              echo
            } >> "${out_file}"
          done < <(
            find . \
              \( \
                -path './.git' \
                -o -path './node_modules' \
                -o -path './vendor' \
                -o -path './dist' \
                -o -path './build' \
                -o -path './out' \
                -o -path './coverage' \
                -o -path './artifacts' \
                -o -path './.next' \
                -o -path './target' \
                -o -path './bin' \
                -o -path './obj' \
                -o -path './tmp' \
                -o -path './temp' \
                -o -path './caches' \
                -o -path './emily-agent/conversations' \
                -o -path './emily-agent/emily-state' \
                -o -path './emily-collect' \
              \) -prune -o \
              -type f \
              ! -name '*.zip' \
              ! -name '*.tar.gz' \
              ! -name '*.tar' \
              ! -path './emily-agent/emily-agent' \
              ! -name "${out_file}" \
              -print | sed 's#^./##' | LC_ALL=C sort
          )

      - name: Upload construct artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EMILY-construct-${{ github.run_number }}-${{ github.sha }}
          path: EMILY_CONSTRUCT.txt
          if-no-files-found: error
